name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: apcu
          ini-values: apc.enable_cli=1
          tools: phpunit:12

      - run: phpunit --configuration phpunit.xml tests
